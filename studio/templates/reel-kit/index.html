<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AK Consultancy - reel kit (data-driven)</title>
<meta name="viewport" content="width=1080, height=1920">
<style>
:root { --gold:#f2c14e; --gold2:#ffdf8a; --red:#ff5a4f; --green:#25d366; }
* { box-sizing:border-box; }
html,body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#000; }
#main { position:absolute; inset:0; overflow:hidden; color:#fff; font-family:"Poppins", sans-serif;
  background: radial-gradient(ellipse 70% 45% at 50% 38%, #18306e 0%, #0b1a42 45%, #050b1e 100%); }
.scene { position:absolute; inset:0; }
#gl { position:absolute; left:0; top:0; width:1080px; height:1920px; display:block; }
#halo { position:absolute; left:90px; top:250px; width:900px; height:900px; border-radius:50%;
  background: radial-gradient(circle, rgba(242,193,78,.22) 0%, rgba(242,193,78,.06) 45%, rgba(0,0,0,0) 70%); }
#floor { position:absolute; left:-300px; right:-300px; top:1180px; height:900px; transform-origin:50% 0;
  transform: perspective(700px) rotateX(64deg);
  background-image:linear-gradient(rgba(242,193,78,.20) 2px,transparent 2px),linear-gradient(90deg,rgba(242,193,78,.20) 2px,transparent 2px);
  background-size:90px 90px; -webkit-mask-image:linear-gradient(transparent, #000 35%, transparent 95%); opacity:.55; }
#parts { position:absolute; inset:0; }
.pt { position:absolute; width:8px; height:8px; border-radius:50%; background:#ffdf8a; box-shadow:0 0 14px 4px rgba(242,193,78,.55); }
#grain { position:absolute; inset:0; width:100%; height:100%; opacity:.07; mix-blend-mode:overlay; pointer-events:none; }
#vig { position:absolute; inset:0; background: radial-gradient(ellipse 80% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events:none; }
.line { position:absolute; left:60px; width:960px; text-align:center; white-space:pre; }
.title { font-family:"Montserrat", sans-serif; font-weight:900; letter-spacing:-0.035em; }
.goldtxt { color:var(--gold); text-shadow: 0 2px 0 #b8841f, 0 4px 0 #8a5f12, 0 10px 24px rgba(0,0,0,.55); }
.redtxt { color:var(--red); text-shadow: 0 2px 0 #b8322a, 0 4px 0 #7d1f19, 0 10px 24px rgba(0,0,0,.55); }
.white { color:#fff; text-shadow: 0 6px 22px rgba(0,0,0,.6); }
#emblem { position:absolute; left:340px; top:470px; width:400px; height:400px; border-radius:50%;
  background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.03)); border:3px solid rgba(242,193,78,.6);
  box-shadow:0 0 0 22px rgba(242,193,78,.08), 0 40px 90px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.3); }
#emblem svg { position:absolute; left:80px; top:80px; width:240px; height:240px; }
#h1 { top:1265px; font-size:92px; line-height:100px; }
#h2 { top:1372px; font-size:54px; line-height:68px; font-weight:700; }
#tag { position:absolute; left:50%; top:262px; transform:translateX(-50%); padding:14px 34px; border-radius:60px;
  background:rgba(255,255,255,.08); border:2px solid rgba(242,193,78,.55); font-size:34px; font-weight:600; letter-spacing:.06em; color:var(--gold2); white-space:nowrap; }
#big { top:620px; font-size:230px; line-height:260px; }
#s2a { top:980px; font-size:110px; line-height:120px; }
#s2b { top:1120px; font-size:54px; line-height:68px; font-weight:600; }
/* chat */
.bub { position:absolute; width:820px; padding:34px 40px; border-radius:44px; font-size:46px; line-height:60px; font-weight:600;
  box-shadow:0 26px 60px rgba(0,0,0,.5); }
.bub .who { font-family:"Montserrat"; font-weight:900; font-size:30px; letter-spacing:.08em; margin-bottom:8px; }
#q { left:80px; top:430px; background:linear-gradient(160deg,#ffffff,#e9eefc); color:#0d1b3d; border-bottom-left-radius:10px; }
#q .who { color:#8a5f12; }
#bad { left:180px; top:800px; background:linear-gradient(160deg,rgba(255,90,79,.30),rgba(255,90,79,.12)); border:3px solid rgba(255,90,79,.8); border-bottom-right-radius:10px; }
#good { left:180px; top:1110px; background:linear-gradient(160deg,rgba(37,211,102,.30),rgba(37,211,102,.10)); border:3px solid rgba(37,211,102,.85); border-bottom-right-radius:10px; }
#bad .who { color:#ffb3ad; } #good .who { color:#a8f5c6; }
.mk { position:absolute; right:-34px; top:-34px; width:96px; height:96px; border-radius:50%; font:900 58px/96px "Montserrat"; text-align:center; color:#fff; box-shadow:0 12px 30px rgba(0,0,0,.5); }
#bad .mk { background:#ff5a4f; } #good .mk { background:#1fae57; }
#strike { position:absolute; left:20px; top:50%; height:8px; width:780px; background:#ff5a4f; border-radius:6px; transform-origin:0 50%; }
/* letter */
#paper { position:absolute; left:150px; top:420px; width:780px; height:980px; border-radius:26px; background:linear-gradient(170deg,#ffffff,#eef1f7);
  box-shadow:0 50px 110px rgba(0,0,0,.6); color:#0d1b3d; padding:70px 64px; }
#paper .ph { font-family:"Montserrat"; font-weight:900; font-size:50px; letter-spacing:-.02em; }
#paper .sub { font-size:30px; color:#5a6685; margin:8px 0 40px; }
.bar { height:22px; border-radius:11px; background:#d6dcea; margin:0 0 26px; }
#reason { position:relative; margin:40px 0 46px; font-size:40px; font-weight:700; line-height:56px; padding:10px 14px; }
#hl { position:absolute; left:0; top:0; bottom:0; width:100%; background:rgba(242,193,78,.75); border-radius:10px; transform-origin:0 50%; z-index:0; }
#reason span { position:relative; z-index:1; }
#lens { position:absolute; left:560px; top:820px; width:300px; height:300px; border-radius:50%; border:16px solid #f2c14e;
  box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,255,255,.4); background:rgba(255,255,255,.12); }
#lens:after { content:""; position:absolute; left:250px; top:250px; width:150px; height:34px; border-radius:18px; background:#c98a14; transform:rotate(45deg); transform-origin:0 50%; }
/* progress */
#prog { position:absolute; left:120px; top:300px; width:840px; }
#progLbl { font-size:34px; font-weight:700; letter-spacing:.08em; color:var(--gold2); margin-bottom:18px; text-align:left; }
#track { height:18px; border-radius:12px; background:rgba(255,255,255,.12); overflow:hidden; }
#fill { height:100%; width:840px; border-radius:12px; background:linear-gradient(90deg,#f2c14e,#ffe9a8); transform-origin:0 50%; box-shadow:0 0 22px rgba(242,193,78,.7); }
.card { position:absolute; left:90px; top:520px; width:900px; height:900px; border-radius:56px;
  background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.22); box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3); }
.num { position:absolute; left:0; top:70px; width:900px; text-align:center; font-family:"Montserrat"; font-weight:900; font-size:230px; line-height:230px; letter-spacing:-0.04em; }
.xbadge { position:absolute; left:380px; top:350px; width:140px; height:140px; border-radius:50%; background:linear-gradient(160deg,#ffdf8a,#d9a032);
  box-shadow:0 0 0 14px rgba(242,193,78,.18), 0 18px 40px rgba(0,0,0,.5); }
.xbadge.red { background:linear-gradient(160deg,#ff8a80,#e0372c); box-shadow:0 0 0 14px rgba(255,90,79,.18), 0 18px 40px rgba(0,0,0,.5); }
.xbadge svg { position:absolute; left:30px; top:30px; width:80px; height:80px; }
.ct { position:absolute; left:20px; width:860px; text-align:center; white-space:pre; }
.ct1 { top:540px; font-family:"Montserrat"; font-weight:900; font-size:76px; line-height:88px; letter-spacing:-0.03em; }
.ct2 { top:640px; font-family:"Montserrat"; font-weight:900; font-size:76px; line-height:88px; letter-spacing:-0.03em; color:var(--gold); }
.ct3 { top:770px; font-size:40px; line-height:52px; font-weight:500; color:rgba(255,255,255,.85); }
#c1 { top:470px; font-size:72px; line-height:84px; font-weight:700; }
#c2 { top:600px; font-size:230px; line-height:260px; }
#c3 { top:930px; font-size:50px; line-height:66px; font-weight:600; }
#wa { position:absolute; left:140px; top:1100px; width:800px; height:150px; border-radius:80px; background:#25d366;
  box-shadow:0 22px 60px rgba(37,211,102,.45); color:#06240f; font-family:"Montserrat"; font-weight:900; font-size:66px; line-height:150px; text-align:center; }
#wa small { font-family:"Poppins"; font-weight:700; font-size:34px; letter-spacing:.04em; margin-right:18px; vertical-align:middle; }
#brand { top:1320px; font-size:40px; line-height:52px; font-weight:700; color:var(--gold2); letter-spacing:.12em; }
#addr { top:1376px; font-size:30px; line-height:40px; font-weight:500; color:rgba(255,255,255,.7); }
#flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="main"><div id="world" class="scene"></div>
  <div id="vig"></div>
  <svg id="grain" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="flash"></div>
</div>
<script src="./cfg.js"></script>
<script src="./runtime/vendor/gsap.min.js"></script>
<script src="./runtime/motion.js"></script>
<script>
const C = window.CFG, FPS = 30, GOLD = '#f2c14e';
const ICONS = {
  calendar: '<rect x="20" y="36" width="200" height="180" rx="22"/><path d="M20 86h200M70 16v40M170 16v40M62 130h30M106 130h30M150 130h30M62 172h30M106 172h30"/>',
  phone: '<rect x="62" y="10" width="116" height="220" rx="22"/><circle cx="120" cy="104" r="34"/><path d="M98 196h44"/>',
  doc: '<path d="M50 14h100l50 50v162H50z"/><path d="M150 14v50h50M80 110h90M80 146h90M80 182h56"/>',
  plane: '<path d="M18 132l82-18 54-80c8-12 26-8 22 8l-20 72 62 6 18-22h16l-10 44 10 44h-16l-18-22-62 6 20 72c4 16-14 20-22 8l-54-80-82-18z"/>',
  list: '<rect x="26" y="20" width="188" height="200" rx="22"/><path d="M60 80l14 14 26-28M120 82h60M60 150l14 14 26-28M120 152h60"/>',
};
const W = document.getElementById('world');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
let html = '';
/* scene 1 */
html += `<div id="s1" class="scene"><div id="halo"></div>${C.globe ? '<canvas id="gl"></canvas>' : `<div id="floor"></div><div id="parts"></div><div id="emblem"><svg viewBox="0 0 240 240" fill="none" stroke="${GOLD}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><g id="ico">${ICONS[C.icon || 'doc']}</g></svg></div>`}
  <div id="tag">${esc(C.tag)}</div><div id="h1" class="line title goldtxt">${esc(C.h1)}</div><div id="h2" class="line white">${esc(C.h2)}</div></div>`;
/* scene 2 */
const mid = C.mid;
if (mid.type === 'slam') html += `<div id="s2" class="scene" style="opacity:0"><div id="big" class="line title ${mid.red ? 'redtxt' : 'goldtxt'}" style="font-size:${mid.size || 230}px">${esc(mid.big)}</div>
  <div id="s2a" class="line title white">${esc(mid.a)}</div><div id="s2b" class="line white">${esc(mid.b)}</div></div>`;
if (mid.type === 'chat') html += `<div id="s2" class="scene" style="opacity:0">
  <div id="q" class="bub"><div class="who">OFFICER</div><span id="qt">${esc(mid.q)}</span></div>
  <div id="bad" class="bub"><div class="who">GALAT JAWAB</div><span id="bt">${esc(mid.bad)}</span><div class="mk">✕</div><div id="strike"></div></div>
  <div id="good" class="bub"><div class="who">SAHI JAWAB</div><span id="gt">${esc(mid.good)}</span><div class="mk">✓</div></div></div>`;
if (mid.type === 'letter') html += `<div id="s2" class="scene" style="opacity:0"><div id="paper"><div class="ph">${esc(mid.title)}</div><div class="sub">${esc(mid.sub)}</div>
  <div class="bar" style="width:92%"></div><div class="bar" style="width:78%"></div><div class="bar" style="width:86%"></div>
  <div id="reason"><div id="hl"></div><span>${esc(mid.reason)}</span></div>
  <div class="bar" style="width:70%"></div><div class="bar" style="width:88%"></div><div class="bar" style="width:60%"></div></div><div id="lens"></div></div>`;
/* progress + cards */
const N = C.cards.length;
html += `<div id="prog" style="visibility:hidden"><div id="progLbl">${esc(C.progLabel)} <span style="position:relative;display:inline-block;width:26px">${C.cards.map((_, i) => `<span id="pn${i + 1}" style="position:absolute;left:0;top:-38px;visibility:hidden">${i + 1}</span>`).join('')}</span> / ${N}</div><div id="track"><div id="fill"></div></div></div>`;
const red = C.badge === 'x';
C.cards.forEach((c, i) => {
  const path = red ? 'M20 20 L60 60 M60 20 L20 60' : 'M14 42 L32 60 L66 20';
  html += `<div id="w${i + 1}" class="scene" style="opacity:0"><div id="k${i + 1}" class="card"><div class="num ${red ? 'redtxt' : 'goldtxt'}">${String(i + 1).padStart(2, '0')}</div>
   <div class="xbadge ${red ? 'red' : ''}"><svg viewBox="0 0 80 80"><path id="x${i + 1}" d="${path}" stroke="${red ? '#fff' : '#0b1a42'}" stroke-width="12" stroke-linecap="round" fill="none"/></svg></div>
   <div class="ct ct1" id="k${i + 1}a">${esc(c.a)}</div><div class="ct ct2" id="k${i + 1}b">${esc(c.b)}</div><div class="ct ct3">${esc(c.c)}</div></div></div>`;
});
html += `<div id="s6" class="scene" style="opacity:0"><div id="c1" class="line white">${esc(C.cta.c1)}</div><div id="c2" class="line title goldtxt" style="font-size:${C.cta.size || 230}px">${esc(C.cta.key)}</div>
  <div id="c3" class="line white">${esc(C.cta.c3)}</div><div id="wa"><small>WHATSAPP</small>97803 10024</div>
  <div id="brand" class="line">AK CONSULTANCY</div><div id="addr" class="line">Vikas Puri, New Delhi · akconsultancyindia.com</div></div>`;
W.innerHTML = html;
/* fit check: no headline wider than its box (960 px lines, 860 px card text) - shrink, never wrap */
document.querySelectorAll('.line, .ct').forEach(el => {
  const max = el.classList.contains('ct') ? 840 : 940; let fs = parseFloat(getComputedStyle(el).fontSize);
  const m = document.createElement('span'); m.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:inherit;letter-spacing:inherit';
  m.textContent = el.textContent; el.appendChild(m);
  while (m.getBoundingClientRect().width > max && fs > 30) { fs -= 2; el.style.fontSize = fs + 'px'; }
  m.remove();
});

/* ---------- timeline ---------- */
const HOOK = 120, MIDF = mid.type === 'slam' ? 105 : mid.type === 'chat' ? 215 : 170, CARD = 105, CTAF = 105;
const T2 = HOOK, T3 = T2 + MIDF, TC = T3 + N * CARD, DUR = (TC + CTAF) / FPS;
window.__DUR = DUR;
const M = Motion.film({ fps: FPS, duration: DUR, width: 1080, height: 1920, clock: 'smooth' });

/* scene 1 visual */
if (C.globe) {
  const DEL = [28.6, 77.2], RG = 2.05, DESTS = C.globe.routes;
  const v3 = (THREE, lat, lon, r) => { const a = lat * Math.PI / 180, b = lon * Math.PI / 180;
    return new THREE.Vector3(r * Math.cos(a) * Math.sin(b), r * Math.sin(a), r * Math.cos(a) * Math.cos(b)); };
  const ARCS = [];
  M.hero3d('#gl', {
    envMap: 'studio', toneMapping: 'neutral', exposure: 1.1,
    key: { position: [-5, 6, 7], intensity: 2.0 }, rim: { position: [6, 2, -6], intensity: 3.5 },
    camera: { fov: 30, position: [0, -1.2, 17], target: [0, -1.2, 0] }, objects: [],
    build: (THREE) => {
      const globe = new THREE.Group(), earth = new THREE.Group(); globe.add(earth);
      earth.add(new THREE.Mesh(new THREE.SphereGeometry(RG * 0.985, 96, 64),
        new THREE.MeshPhysicalMaterial({ color: '#0c1f55', metalness: 0.35, roughness: 0.42, clearcoat: 0.9, clearcoatRoughness: 0.12 })));
      const Np = 2600, pos = new Float32Array(Np * 3), g = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < Np; i++) { const y = 1 - (i / (Np - 1)) * 2, r = Math.sqrt(1 - y * y), th = g * i;
        pos[i*3] = Math.cos(th) * r * RG; pos[i*3+1] = y * RG; pos[i*3+2] = Math.sin(th) * r * RG; }
      const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      earth.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: '#7fa2ff', size: 4.2, sizeAttenuation: false, transparent: true, opacity: 0.75 })));
      const a = v3(THREE, DEL[0], DEL[1], 1);
      const pinMat = new THREE.MeshStandardMaterial({ color: '#ffffff', emissive: GOLD, emissiveIntensity: 1.2 });
      const pin = p => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), pinMat); m.position.copy(p.clone().multiplyScalar(RG * 1.005)); earth.add(m); };
      pin(a);
      let midSum = new THREE.Vector3();
      DESTS.forEach(d => {
        const b = v3(THREE, d[0], d[1], 1), pts = [], ang = a.angleTo(b);
        for (let i = 0; i <= 120; i++) { const u = i / 120;
          const p = a.clone().multiplyScalar(Math.sin((1 - u) * ang) / Math.sin(ang)).add(b.clone().multiplyScalar(Math.sin(u * ang) / Math.sin(ang)));
          pts.push(p.normalize().multiplyScalar(RG * (1 + 0.28 * Math.sin(Math.PI * u)))); }
        const curve = new THREE.CatmullRomCurve3(pts), tube = new THREE.TubeGeometry(curve, 240, 0.03, 10, false);
        const arc = new THREE.Mesh(tube, new THREE.MeshStandardMaterial({ color: GOLD, emissive: '#c98a14', emissiveIntensity: 1.4, metalness: .6, roughness: .3 }));
        earth.add(arc); ARCS.push({ curve, arc, idx: tube.index.count }); pin(b); midSum.add(curve.getPoint(0.5).normalize());
      });
      const plane = new THREE.Group(), pm = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: .2, roughness: .25, clearcoat: 1 });
      const fus = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.34, 8, 16), pm); fus.rotation.x = Math.PI / 2; plane.add(fus);
      const wing = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.018, 0.12), pm); wing.position.z = 0.02; plane.add(wing);
      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.014, 0.07), pm); tail.position.z = -0.17; plane.add(tail);
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.1, 0.08), new THREE.MeshStandardMaterial({ color: GOLD, metalness: .7, roughness: .3 })); fin.position.set(0, 0.06, -0.17); plane.add(fin);
      plane.scale.setScalar(1.25); earth.add(plane);
      earth.quaternion.setFromUnitVectors(midSum.normalize(), new THREE.Vector3(0, 0.32, 1).normalize());
      return { globe, earth, plane };
    },
    state: (t, o, { key, THREE }) => {
      const n = ARCS.length, seg = 3.0 / n;
      ARCS.forEach((A, i) => { const u = key(t, [[0.5 + i * seg * 0.8, 0], [0.5 + i * seg * 0.8 + seg * 1.2, 1, 'softInOut']]);
        A.arc.geometry.setDrawRange(0, Math.floor(u * A.idx / 6) * 6); A.u = u; });
      let cur = ARCS[0];
      ARCS.forEach(A => { if (A.u > 0 && A.u < 1) cur = A; });
      if (ARCS.every(A => A.u >= 1)) cur = ARCS[n - 1];
      const uu = Math.min(Math.max(cur.u, 0.001), 0.999);
      const p = cur.curve.getPointAt(uu), tg = cur.curve.getTangentAt(uu);
      o.plane.position.copy(p.clone().add(p.clone().normalize().multiplyScalar(0.05)));
      o.plane.quaternion.setFromRotationMatrix(new THREE.Matrix4().lookAt(new THREE.Vector3(0, 0, 0), tg, p.clone().normalize()));
      o.plane.visible = t > 0.45;
      return {
        camera: { position: key(t, [[0, [0.8, -1.6, 22]], [1.2, [0, -1.2, 17], 'snapSettle'], [4, [-0.25, -1.05, 16.2], 'cruise']]), target: [0, -1.2, 0], fov: 30 },
        objects: { globe: { rotation: [0.08, key(t, [[0, -0.55], [1.2, -0.12, 'softLand'], [4, 0.1, 'cruise']]), 0] } },
      };
    },
  });
} else {
  // gold particles + perspective floor + emblem icon that draws itself
  const P = document.getElementById('parts');
  for (let i = 0; i < 26; i++) { const d = document.createElement('div'); d.className = 'pt'; d.id = 'pt' + i;
    d.style.left = (60 + (i * 397) % 960) + 'px'; d.style.top = (300 + (i * 613) % 1000) + 'px'; d.style.opacity = (0.25 + (i % 5) * 0.12).toFixed(2); P.appendChild(d);
    M.kf('#pt' + i, 'y', [[0, 0], [HOOK, -(60 + (i % 7) * 25)]]); }
  M.kf('#floor', 'backgroundPositionY', [[0, 0], [HOOK, 180]], { fmt: v => v + 'px' });
  M.enter('#emblem', { at: 2, frames: 14, ease: 'crashIn', from: { scale: 2.8, blur: 14 } });
  M.kf('#emblem', 'rotationY', [[16, -14], [HOOK, 14]]);
  document.querySelectorAll('#ico > *').forEach((el, i) => { const L = Math.ceil(el.getTotalLength ? el.getTotalLength() : 600);
    el.style.strokeDasharray = L; el.id = el.id || ('ic' + i); M.kf('#' + el.id, 'strokeDashoffset', [[8 + i * 3, L], [30 + i * 3, 0, 'softLand']]); });
  M.mark(2, 'impact', 'emblem slam');
}
M.enter('#tag', { at: 6, frames: 12, ease: 'softLand', from: { y: -40, opacity: 0, blur: 8 } });
M.words('#h1', { at: 14, mech: 'rise', dist: 90, gaps: 5, smear: true, accent: { color: '#ffffff', frames: 18, word: C.h1Accent ?? -1 } });
M.words('#h2', { at: 40, mech: 'rise', dist: 60, gaps: 4, smear: true, accent: { color: GOLD, frames: 22, word: C.h2Accent ?? -1 } });
M.kf('#h1', 'letterSpacing', [[14, 0.04], [40, -0.035, 'softLand']], { fmt: v => v + 'em' });
M.kf('#h1', 'fontWeight', [[14, 400], [36, 900, 'softLand']], { step: 1 });
M.kf('#s1', 'scale', [[0, 1], [HOOK, 1.04]]);
M.mark(14, 'impact', 'hook lands');

/* cuts */
const CUTS = [T2, T3]; for (let i = 1; i < N; i++) CUTS.push(T3 + i * CARD); CUTS.push(TC);
CUTS.forEach(f => { M.kf('#flash', 'opacity', [[f, 0], [f, 0.55], [f + 5, 0, 'softLand']]); M.mark(f, 'cut', 'scene cut'); });
const on = (sel, a, b) => M.kf(sel, 'opacity', b == null ? [[0, 0], [a, 0], [a, 1]] : [[0, 0], [a, 0], [a, 1], [b, 1], [b, 0]]);
M.kf('#s1', 'opacity', [[0, 1], [T2, 1], [T2, 0]]);
on('#s2', T2, T3); C.cards.forEach((_, i) => on('#w' + (i + 1), T3 + i * CARD, T3 + (i + 1) * CARD)); on('#s6', TC);

/* scene 2 */
if (mid.type === 'slam') {
  M.enter('#big', { at: T2 + 1, frames: 10, ease: 'crashIn', from: { scale: 2.6, blur: 14 } }); M.mark(T2 + 1, 'impact', 'big slam');
  M.kf('#big', 'letterSpacing', [[T2 + 1, 0.06], [T2 + 20, -0.035, 'softLand']], { fmt: v => v + 'em' });
  M.words('#s2a', { at: T2 + 12, mech: 'pop', dist: .4, gaps: 4 }); M.mark(T2 + 12, 'pop', 'promise');
  M.words('#s2b', { at: T2 + 26, mech: 'rise', dist: 50, gaps: 3, smear: true, accent: { color: GOLD, frames: 20, word: mid.bAccent ?? -1 } });
  M.kf('#s2', 'scale', [[T2 + 1, 1.06], [T3, 1, 'glide']]);
}
if (mid.type === 'chat') {
  M.enter('#q', { at: T2 + 2, frames: 14, ease: 'snapSettle', from: { x: -500, scale: .9 } }); M.mark(T2 + 2, 'pop', 'question');
  M.words('#qt', { at: T2 + 8, mech: 'rise', dist: 30, gaps: 3 });
  M.enter('#bad', { at: T2 + 55, frames: 14, ease: 'snapSettle', from: { x: 500, scale: .9 } }); M.mark(T2 + 55, 'pop', 'bad answer');
  M.words('#bt', { at: T2 + 60, mech: 'rise', dist: 30, gaps: 3 });
  M.enter('#bad .mk', { at: T2 + 95, frames: 12, ease: 'popOver', from: { scale: 0 } }); M.mark(T2 + 95, 'impact', 'wrong');
  M.kf('#strike', 'scaleX', [[0, 0], [T2 + 100, 0], [T2 + 110, 1, 'softLand']]);
  M.kf('#bad', 'opacity', [[T2 + 110, 1], [T2 + 125, .45, 'softLand']]);
  M.enter('#good', { at: T2 + 120, frames: 14, ease: 'snapSettle', from: { x: 500, scale: .9 } }); M.mark(T2 + 120, 'pop', 'good answer');
  M.words('#gt', { at: T2 + 125, mech: 'rise', dist: 30, gaps: 3 });
  M.enter('#good .mk', { at: T2 + 175, frames: 12, ease: 'popOver', from: { scale: 0 } }); M.mark(T2 + 175, 'click', 'right');
  M.kf('#s2', 'y', [[T2, 0], [T3, -40]]);
}
if (mid.type === 'letter') {
  M.enter('#paper', { at: T2 + 1, frames: 16, ease: 'snapSettle', from: { y: 300, rotation: -6, scale: .9 } }); M.mark(T2 + 1, 'pop', 'letter');
  M.kf('#paper', 'rotation', [[T2 + 17, -2], [T3, 1.5]]);
  M.kf('#hl', 'scaleX', [[0, 0], [T2 + 60, 0], [T2 + 82, 1, 'softLand']]); M.mark(T2 + 60, 'tick', 'highlight');
  M.enter('#lens', { at: T2 + 34, frames: 18, ease: 'snapSettle', from: { x: 300, y: 300, scale: 1.6 } }); M.mark(T2 + 34, 'whoosh', 'lens');
  M.kf('#lens', 'x', [[T2 + 52, 0], [T2 + 95, -380, 'softInOut'], [T2 + 140, -40, 'softInOut'], [T3, 0, 'glide']]);
  M.kf('#lens', 'y', [[T2 + 52, 0], [T2 + 110, -290, 'softInOut']]);
  M.kf('#s2', 'scale', [[T2 + 1, 1], [T3, 1.06]]);
}

/* cards + progress */
M.show('#prog', T3, TC); M.enter('#prog', { at: T3, frames: 12, ease: 'softLand', from: { y: -50 } });
const fills = [[T3, 0.02]]; C.cards.forEach((_, i) => { const f = T3 + i * CARD; if (i) fills.push([f, i / N]); fills.push([f + 15, (i + 1) / N, 'snapSettle']); M.mark(f + 15, 'tick', 'progress ' + (i + 1)); M.show('#pn' + (i + 1), f, f + CARD); });
M.kf('#fill', 'scaleX', fills);
C.cards.forEach((_, i) => { const n = i + 1, f = T3 + i * CARD, c = '#k' + n;
  M.enter(c, { at: f, frames: 14, ease: 'snapSettle', from: { y: 160, scale: .9, rotation: i % 2 ? 3 : -3 }, smear: { axis: 'y', px: 40, frames: 3 } });
  M.enter(c + ' .num', { at: f + 4, frames: 10, ease: 'crashIn', from: { scale: 1.8, blur: 10 } });
  M.enter(c + ' .xbadge', { at: f + 14, frames: 15, ease: 'popOver', from: { scale: 0 } }); M.mark(f + 14, 'pop', 'badge ' + n);
  const path = document.querySelector('#x' + n); const L = 150; path.style.strokeDasharray = L;
  M.kf('#x' + n, 'strokeDashoffset', [[f + 18, L], [f + 30, 0, 'softLand']]); M.mark(f + 24, 'click', 'tick ' + n);
  M.words(c + 'a', { at: f + 26, mech: 'rise', dist: 70, gaps: 4, smear: true });
  M.words(c + 'b', { at: f + 38, mech: 'pop', dist: .5, gaps: 5 });
  M.enter(c + ' .ct3', { at: f + 56, frames: 12, ease: 'softLand', from: { y: 30, opacity: 0 } });
  M.kf(c, 'y', [[f + 14, 0], [f + CARD - 1, -18]]);
});

/* CTA */
M.words('#c1', { at: TC + 2, mech: 'rise', dist: 50, gaps: 4 });
M.enter('#c2', { at: TC + 10, frames: 10, ease: 'crashIn', from: { scale: 2.4, blur: 16 } }); M.mark(TC + 10, 'impact', 'keyword slam');
M.kf('#c2', 'letterSpacing', [[TC + 10, 0.08], [TC + 30, -0.035, 'softLand']], { fmt: v => v + 'em' });
M.kf('#c2', 'scale', [[TC + 20, 1], [TC + CTAF, 1.06]]);
M.words('#c3', { at: TC + 26, mech: 'rise', dist: 40, gaps: 3, accent: { color: GOLD, frames: 20, word: C.cta.c3Accent ?? -1 } });
M.enter('#wa', { at: TC + 44, frames: 15, ease: 'popOver', from: { scale: 0.3, y: 40 } }); M.mark(TC + 44, 'pop', 'whatsapp');
M.kf('#wa', 'scale', [[TC + 60, 1], [TC + 66, 1.05, 'softLand'], [TC + 74, 1, 'softLand'], [TC + 80, 1], [TC + 86, 1.04, 'softLand'], [TC + 94, 1, 'softLand'], [TC + 98, 1], [TC + 103, 1.03, 'softLand']]);
M.enter('#brand', { at: TC + 56, frames: 12, ease: 'softLand', from: { y: 30, opacity: 0 } });
M.enter('#addr', { at: TC + 62, frames: 12, ease: 'softLand', from: { y: 30, opacity: 0 } });
M.mark(TC - 50, 'riser', 'into CTA');

window.render = t => window.__seek(t);
window.__ready = Motion.loaded();
</script>
</body>
</html>
